version: '3.8'

services:
  php-app:
    build: .
    container_name: php-benchmark-app
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html

  benchmark:
    image: alpine:latest
    container_name: php-benchmark-tools
    depends_on:
      - php-app
    volumes:
      - ./benchmark:/benchmark
      - ./results:/results
    command: |
      sh -c "
        apk add --no-cache apache2-utils curl bash &&
        tail -f /dev/null
      "

  gatling:
    image: openjdk:11-jre-slim
    container_name: php-benchmark-gatling
    depends_on:
      - php-app
    volumes:
      - ./gatling/user-files:/opt/gatling/user-files
      - ./results:/opt/gatling/results
    working_dir: /opt/gatling
    command: |
      sh -c "
        apt-get update &&
        apt-get install -y curl bash wget unzip &&
        echo 'Container ready. Use setup-gatling.sh to install Gatling.' &&
        tail -f /dev/null
      "